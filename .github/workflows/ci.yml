name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VikingClip.sln

      - name: Build
        run: dotnet build VikingClip.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/VikingClip.Core.Tests/VikingClip.Core.Tests.csproj -c Release --no-build --nologo
